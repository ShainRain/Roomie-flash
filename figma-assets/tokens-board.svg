    <radialGradient id="tok-l0-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3E3A32" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3E3A32" stop-opacity="0"/>
    </radialGradient>
