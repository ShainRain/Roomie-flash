# Deploy preview-app (Vite) to GitHub Pages
# Site URL: https://shainrain.github.io/Roomie-flash/ (served from subpath /Roomie-flash/)
# NOTE: requires repo Settings → Pages → Source = "GitHub Actions" (manual, repo owner).
name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-app/package-lock.json

      - run: npm ci

      # sync-shared 漂移检查 + player + room-map 断言（prebuild 也会跑 sync-assets/sync-shared）
      - run: npm test

      # GitHub Pages 子路径：/Roomie-flash/ 作为 vite base
      - run: npm run build -- --base=/Roomie-flash/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
