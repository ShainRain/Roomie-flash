<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Roomie · 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 390px; }
  body {
    font-family: -apple-system, "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
    font-size: 13.52px; line-height: 1.5; color: #F2ECDC;
    background: #0C1424;
  }
  .en-serif { font-family: "Oranienbaum", "Times New Roman", serif; letter-spacing: 4.16px; text-transform: uppercase; }

  /* ---- 模拟状态栏(深夜) ---- */
  .statusbar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px 0 32px; font-size: 14px; font-weight: 600; color: #F2ECDC;
  }
  .sb-right { display: flex; align-items: center; gap: 6px; }
  .sb-signal { display: flex; align-items: flex-end; gap: 1.5px; height: 11px; }
  .sb-signal i { width: 3px; background: #F2ECDC; border-radius: 1px; display: block; }
  .sb-signal i:nth-child(1) { height: 4px; } .sb-signal i:nth-child(2) { height: 6px; }
  .sb-signal i:nth-child(3) { height: 8px; } .sb-signal i:nth-child(4) { height: 10px; }
  .sb-battery { width: 22px; height: 11px; border: 1.5px solid rgba(242,236,220,.5); border-radius: 3px; position: relative; display: block; }
  .sb-battery::before { content: ''; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: #F2ECDC; border-radius: 1px; }
  .sb-battery::after { content: ''; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: rgba(242,236,220,.5); border-radius: 0 1px 1px 0; }

  .page {
    min-height: calc(100vh - 44px);
    background: linear-gradient(180deg, #0C1424 0%, #101B30 55%, #0C1424 100%);
    padding: 0 16.64px 114px;
  }

  .card { background: #F6EFDD; background-image: radial-gradient(rgba(138,90,51,.05) .52px, transparent .83px); background-size: 7.28px 7.28px; color: #26221A; border-radius: 16.64px; box-shadow: 0 6.24px 16.64px rgba(4,8,18,.45); }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4.16px 12.48px; font-size: 11.44px; }
  .pill-live { background: #2FBF71; color: #fff; font-weight: 600; box-shadow: 0 3.12px 8.32px rgba(47,191,113,.35); }
  .pill-dark { background: rgba(246,239,221,.10); color: #F2ECDC; border: .52px solid rgba(246,239,221,.14); }
  .pill-amber { background: rgba(240,169,60,.16); color: #C9821E; font-weight: 600; }
  .btn-primary { background: #2FBF71; color: #fff; border-radius: 999px; font-weight: 600; text-align: center; box-shadow: 0 5.2px 12.48px rgba(47,191,113,.38), inset 0 1.04px 0 rgba(255,255,255,.28); }

  /* ---- Roomie Header ---- */
  .rh { display: flex; align-items: center; justify-content: space-between; padding: 12.48px 16.64px 4.16px; }
  .rh-left { display: flex; flex-direction: column; gap: 1.04px; }
  .rh-brand { font-size: 17.68px; color: #F2ECDC; letter-spacing: 4.16px; line-height: 1.2; }
  .rh-sub { font-size: 10.4px; color: #8B96AC; letter-spacing: 1.04px; }
  .rh-right { display: flex; align-items: center; gap: 8.32px; }
  .rh-live { display: flex; align-items: center; gap: 4.16px; padding: 4.16px 11.44px; border-radius: 999px; background: #2FBF71; color: #fff; font-size: 10.4px; font-weight: 700; letter-spacing: 1.04px; box-shadow: 0 3.12px 8.32px rgba(47,191,113,.35); }
  .rh-live-dot { width: 5.2px; height: 5.2px; border-radius: 50%; background: #fff; }
  .rh-share { width: 27.04px; height: 27.04px; border-radius: 50%; background: rgba(246,239,221,.10); border: .52px solid rgba(246,239,221,.14); color: #F2ECDC; font-size: 13.52px; display: flex; align-items: center; justify-content: center; }
  .rh-avatar { width: 27.04px; height: 27.04px; border-radius: 50%; background: #F0A93C; color: #fff; font-size: 12.48px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1.56px solid rgba(246,239,221,.35); }

  /* ---- 今晚状态 ---- */
  .tonight { display: flex; flex-direction: column; margin-top: 10.4px; }
  .tonight-hi { font-size: 13.52px; color: #8B96AC; }
  .tonight-title { font-size: 22.88px; font-weight: 700; color: #F2ECDC; line-height: 1.3; margin-top: 2.08px; }
  .tonight-sub { font-size: 11.44px; color: #8B96AC; margin-top: 2.08px; }

  /* ---- 状态胶囊 ---- */
  .pills-row { display: flex; align-items: center; gap: 8.32px; margin-top: 9.36px; }
  .live-dot { width: 6.24px; height: 6.24px; border-radius: 50%; background: #2FBF71; margin-right: 5.2px; }

  /* ---- 房间主视觉 ---- */
  .hero-wrap { position: relative; margin-top: 4.16px; }
  .hero { width: 100%; height: 260px; object-fit: contain; }
  .hero-chip { position: absolute; left: 12.48px; bottom: 36.4px; display: flex; align-items: center; gap: 6.24px; background: #F6EFDD; border-radius: 999px; padding: 5.2px 12.48px 5.2px 6.24px; box-shadow: 0 6.24px 16.64px rgba(4,8,18,.45); }
  .chip-avatar { width: 20.8px; height: 20.8px; border-radius: 50%; background: #F0A93C; color: #fff; font-size: 11.44px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .chip-text { font-size: 11.44px; color: #26221A; font-weight: 600; }

  /* ---- 在线 roomie ---- */
  .online-row { display: flex; align-items: center; gap: 10.4px; margin-top: 2.08px; padding: 4.16px 2.08px; }
  .avatars { display: flex; padding-left: 4.16px; }
  .avatar { width: 29.12px; height: 29.12px; border-radius: 50%; border: 2.08px solid #0C1424; margin-left: -6.24px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12.48px; font-weight: 700; }
  .online-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.04px; }
  .online-count { font-size: 13.52px; font-weight: 700; color: #F2ECDC; }
  .online-detail { font-size: 11.44px; color: #8B96AC; }
  .online-btn { padding: 7.28px 18.72px; font-size: 12.48px; flex-shrink: 0; }

  /* ---- 放映任务 ---- */
  .task-card { margin-top: 10.4px; padding: 12.48px 14.56px; display: flex; align-items: center; gap: 10.4px; }
  .task-plus { width: 33.28px; height: 33.28px; border-radius: 50%; background: #2FBF71; color: #fff; font-size: 22.88px; font-weight: 300; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 5.2px 12.48px rgba(47,191,113,.38), inset 0 1.04px 0 rgba(255,255,255,.28); }
  .task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.04px; }
  .task-sub { font-size: 10.4px; color: #9A9080; }
  .task-title { font-size: 14.56px; font-weight: 700; color: #26221A; }

  /* ---- 深色播放器 ---- */
  .player-card { margin-top: 10.4px; padding: 12.48px 14.56px; display: flex; align-items: center; gap: 10.4px; background: #121D32; border: .52px solid rgba(246,239,221,.10); border-radius: 16.64px; box-shadow: 0 6.24px 16.64px rgba(4,8,18,.5); }
  .vinyl { width: 45.76px; height: 45.76px; border-radius: 50%; background-color: #23262b; background-image: repeating-radial-gradient(circle at center, #23262b 0, #23262b 2.08px, #33373d 2.08px, #33373d 4.16px); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .vinyl-hole { width: 13.52px; height: 13.52px; border-radius: 50%; background: #F0A93C; border: 3.12px solid #121D32; }
  .player-info { flex: 1; display: flex; flex-direction: column; gap: 2.08px; min-width: 0; }
  .song-title { font-size: 14.56px; font-weight: 700; color: #F6EFDD; }
  .song-artist { font-size: 11.44px; color: #8B96AC; }
  .progress-row { display: flex; align-items: center; gap: 6.24px; margin-top: 4.16px; }
  .time { font-size: 10.4px; color: #8B96AC; font-variant-numeric: tabular-nums; }
  .progress-track { flex: 1; height: 4.16px; border-radius: 999px; background: rgba(246,239,221,.14); overflow: hidden; }
  .progress-fill { height: 100%; width: 49.8%; border-radius: 999px; background: #2FBF71; }
  .player-ctrl { display: flex; align-items: center; gap: 8.32px; flex-shrink: 0; }
  .ctrl-sm { font-size: 15.6px; color: #B8C0D0; }
  .ctrl-play { width: 37.44px; height: 37.44px; border-radius: 50%; background: #2FBF71; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15.6px; box-shadow: 0 4.16px 10.4px rgba(47,191,113,.4), inset 0 1.04px 0 rgba(255,255,255,.28); }

  /* ---- 进入放映室 CTA ---- */
  .cta { margin-top: 12.48px; height: 56.16px; display: flex; align-items: center; justify-content: center; gap: 8.32px; font-size: 16.64px; letter-spacing: 1.04px; }
  .cta-arrow { font-size: 17.68px; font-weight: 400; }

  /* ---- 自定义 Tab 栏(深夜) ---- */
  .tabbar { position: fixed; left: 0; width: 390px; bottom: 0; display: flex; align-items: flex-end; height: 66.56px; background: #0E1830; border-top: .52px solid rgba(246,239,221,.10); box-shadow: 0 -4.16px 16.64px rgba(4,8,18,.55); z-index: 10; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 57.2px; color: #7A8398; }
  .tab-on { color: #2FBF71; }
  .tab-label { font-size: 10.4px; margin-top: 3.12px; }
  .ic { position: relative; width: 22.88px; height: 22.88px; }
  .ic-home::before { content: ''; position: absolute; left: 4.16px; top: 10.4px; width: 14.56px; height: 10.4px; border: 2.08px solid currentColor; border-radius: 2.08px; }
  .ic-home::after { content: ''; position: absolute; left: 5.72px; top: 1.04px; width: 10.4px; height: 10.4px; border-left: 2.08px solid currentColor; border-top: 2.08px solid currentColor; transform: rotate(45deg); border-radius: 1.56px; }
  .ic-friends::before { content: ''; position: absolute; left: 2.08px; top: 3.12px; width: 7.28px; height: 7.28px; border: 2.08px solid currentColor; border-radius: 50%; box-shadow: 11.44px 3.12px 0 -2.08px #0E1830, 11.44px 3.12px 0 0 currentColor; }
  .ic-friends::after { content: ''; position: absolute; left: 1.04px; top: 13.52px; width: 9.36px; height: 6.24px; border: 2.08px solid currentColor; border-radius: 5.2px 5.2px 2.08px 2.08px; }
  .ic-msg::before { content: ''; position: absolute; left: 3.12px; top: 4.16px; width: 16.64px; height: 11.44px; border: 2.08px solid currentColor; border-radius: 6.24px; }
  .ic-msg::after { content: ''; position: absolute; left: 8.32px; top: 14.56px; width: 6.24px; height: 6.24px; border-left: 2.08px solid currentColor; border-bottom: 2.08px solid currentColor; transform: rotate(-45deg) skew(-12deg, -12deg); }
  .ic-me::before { content: ''; position: absolute; left: 6.76px; top: 2.08px; width: 8.32px; height: 8.32px; border: 2.08px solid currentColor; border-radius: 50%; }
  .ic-me::after { content: ''; position: absolute; left: 3.64px; top: 13.52px; width: 14.56px; height: 7.28px; border: 2.08px solid currentColor; border-radius: 7.28px 7.28px 2.08px 2.08px; }
  .tab-create { justify-content: flex-start; }
  .create-btn { width: 49.92px; height: 49.92px; margin-top: -18.72px; border-radius: 50%; background: #2FBF71; display: flex; align-items: center; justify-content: center; box-shadow: 0 5.2px 12.48px rgba(47,191,113,.45), inset 0 1.04px 0 rgba(255,255,255,.28), 0 0 0 5.2px #0C1424; }
  .create-plus { color: #fff; font-size: 31.2px; font-weight: 300; line-height: 1; margin-top: -2.08px; }
</style>
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
      <span class="sb-battery"></span>
    </span>
  </div>

  <div class="page">
    <!-- Roomie Header -->
    <div class="rh">
      <div class="rh-left">
        <div class="rh-brand en-serif">ROOMIE</div>
        <div class="rh-sub">深夜放映室 · 0731</div>
      </div>
      <div class="rh-right">
        <div class="rh-live"><div class="rh-live-dot"></div>LIVE</div>
        <div class="rh-share">↗</div>
        <div class="rh-avatar">M</div>
      </div>
    </div>

    <!-- 今晚状态 -->
    <div class="tonight">
      <span class="tonight-hi">今晚,</span>
      <span class="tonight-title">MOMO 想放一首歌</span>
      <span class="tonight-sub">你的房间正在等待一位 roomie…</span>
    </div>

    <!-- 状态胶囊 -->
    <div class="pills-row">
      <div class="pill pill-dark"><div class="live-dot"></div>放映中 · 2 位 roomie</div>
      <div class="pill pill-live">+12 氛围值</div>
    </div>

    <!-- 房间主视觉 -->
    <div class="hero-wrap">
      <img class="hero" src="legacy-assets/room-hero.webp" alt="">
      <div class="hero-chip"><div class="chip-avatar">M</div><span class="chip-text">MOMO 走近唱机</span></div>
    </div>

    <!-- 在线 roomie -->
    <div class="online-row">
      <div class="avatars">
        <div class="avatar" style="background:#F5B83D; z-index:3;">K</div>
        <div class="avatar" style="background:#7FB5E8; z-index:2;">N</div>
        <div class="avatar" style="background:#E8734A; z-index:1;">A</div>
      </div>
      <div class="online-text">
        <span class="online-count">3 位好友在线</span>
        <span class="online-detail">KIKI 正在听《晴天》</span>
      </div>
      <div class="btn-primary online-btn">一起听</div>
    </div>

    <!-- 放映任务 -->
    <div class="card task-card">
      <div class="task-plus">+</div>
      <div class="task-text">
        <span class="task-sub">今晚的放映任务</span>
        <span class="task-title">让 KIKI 找到唱片墙</span>
      </div>
      <div class="pill pill-amber">+80 XP</div>
    </div>

    <!-- 深色播放器 -->
    <div class="player-card">
      <div class="vinyl"><div class="vinyl-hole"></div></div>
      <div class="player-info">
        <span class="song-title">晴天</span>
        <span class="song-artist">周杰伦 · MOMO 的收藏</span>
        <div class="progress-row">
          <span class="time">2:14</span>
          <div class="progress-track"><div class="progress-fill"></div></div>
          <span class="time">4:29</span>
        </div>
      </div>
      <div class="player-ctrl">
        <div class="ctrl-sm">⏮</div>
        <div class="ctrl-play">⏸</div>
        <div class="ctrl-sm">⏭</div>
      </div>
    </div>

    <!-- 进入放映室 -->
    <div class="btn-primary cta"><span>进入放映室</span><span class="cta-arrow">→</span></div>
  </div>

  <!-- 自定义 Tab 栏 -->
  <div class="tabbar">
    <div class="tab tab-on"><div class="ic ic-home"></div><span class="tab-label">房间</span></div>
    <div class="tab"><div class="ic ic-friends"></div><span class="tab-label">好友</span></div>
    <div class="tab tab-create"><div class="create-btn"><span class="create-plus">+</span></div></div>
    <div class="tab"><div class="ic ic-msg"></div><span class="tab-label">消息</span></div>
    <div class="tab"><div class="ic ic-me"></div><span class="tab-label">我</span></div>
  </div>
</body>
</html>
